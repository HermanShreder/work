    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #e4ebf5; /* Мягкий фон в стиле Telegram */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .tg-card {
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        text-align: center;
        max-width: 380px;
        width: 90%;
      }

      .tg-avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2AABEE, #229ED9);
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 20px auto;
        color: #ffffff;
        font-size: 40px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
      }

      .tg-title {
        font-size: 24px;
        font-weight: 700;
        color: #000000;
        margin: 0 0 8px 0;
      }

      .tg-desc {
        font-size: 15px;
        color: #707579;
        margin: 0 0 30px 0;
        line-height: 1.5;
      }

      .tg-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        background-color: #3390ec;
        color: #ffffff;
        text-decoration: none;
        padding: 16px 0;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        transition: background-color 0.2s ease;
        border: none;
        cursor: pointer;
        box-sizing: border-box;
      }

      .tg-btn:hover {
        background-color: #2b7bc6;
      }

      .tg-btn svg {
        margin-right: 10px;
        fill: currentColor;
      }
    </style>
