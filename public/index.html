      background:#229ed9;color:#fff;text-decoration:none;font-size:16px;font-weight:700;
      box-shadow:0 5px 14px rgba(34,158,217,.18);
      transition:background .15s ease,transform .15s ease;
      -webkit-tap-highlight-color:transparent;

  let leadSent = false;

  button.addEventListener("click", function () {
